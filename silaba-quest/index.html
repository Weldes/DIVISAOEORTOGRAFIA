<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sílaba Quest — A Aventura das Palavras</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0d1117;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
#wrap {
  position: relative;
  box-shadow: 0 0 40px rgba(255,215,0,0.3);
  border-radius: 4px;
  overflow: hidden;
}
canvas { display: block; }
#quiz {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(5,5,20,0.97);
  border: 3px solid #FFD700;
  border-radius: 14px;
  padding: 22px 24px 18px;
  width: 700px;
  max-width: 96%;
  z-index: 20;
  color: #fff;
}
#quiz h2 { color:#FFD700; text-align:center; font-size:15px; margin-bottom:12px; letter-spacing:1px; }
#quizQ { font-size:17px; text-align:center; line-height:1.5; margin-bottom:16px; color:#eee; }
#quizOpts { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.obtn {
  padding:11px 10px;
  border:2px solid #FFD700;
  background:transparent;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  border-radius:8px;
  font-family:'Courier New',monospace;
  transition:background .15s, color .15s;
  text-align:center;
}
.obtn:hover:not(:disabled) { background:#FFD700; color:#000; }
.obtn.ok  { background:#1a7a1a; border-color:#1a7a1a; cursor:default; }
.obtn.bad { background:#7a1a1a; border-color:#7a1a1a; cursor:default; }
#quizExp {
  display:none;
  margin-top:12px;
  padding:10px 12px;
  background:rgba(255,215,0,0.08);
  border-left:3px solid #FFD700;
  border-radius:6px;
  font-size:13px;
  color:#FFD700;
  line-height:1.5;
}
#quizCont {
  display:none;
  margin-top:12px;
  width:100%;
  padding:11px;
  background:#FFD700;
  color:#000;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  font-family:'Courier New',monospace;
  letter-spacing:1px;
}
#quizCont:hover { background:#ffe066; }
#hint {
  margin-top:7px;
  color:#888;
  font-size:12px;
  text-align:center;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="450"></canvas>
  <div id="quiz">
    <h2 id="quizTitle"></h2>
    <div id="quizQ"></div>
    <div id="quizOpts"></div>
    <div id="quizExp"></div>
    <button id="quizCont" onclick="closeQuiz()">▶ Continuar aventura!</button>
  </div>
</div>
<p id="hint">← → Mover &nbsp;|&nbsp; ↑ / Espaço Pular &nbsp;|&nbsp; Responda as perguntas para avançar!</p>

// ─── ENGINE ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 450;
const LW = 2800;                // level width
const GROUND_Y = H - 60;       // top of ground
const G = 0.55, JUMP = -13, SPD = 4;

let state = 'title';            // title | playing | quiz | lvlEnd | over | win
let lvlIdx = 0, lives = 3, score = 0;
let qAnswered = 0, qCorrect = 0;

let platforms = [], qblocks = [], coins = [], particles = [];
let camX = 0;
let quizOpen = false, curQ = null;

const pl = { x:80, y:GROUND_Y-44, w:32, h:44, vx:0, vy:0, ground:false, dir:1, wf:0, wt:0 };

const keys = {};
document.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='Enter'||e.code==='Space'){
    if(state==='title')   startGame();
    if(state==='lvlEnd')  doNextLevel();
    if(state==='over')    startGame();
    if(state==='win')     startGame();
  }
});
document.addEventListener('keyup', e=>{ keys[e.code]=false; });

// ─── LEVEL BUILD ──────────────────────────────────────────────────────────────
function buildLevel(idx){
  platforms=[]; qblocks=[]; coins=[]; particles=[];
  camX=0; qAnswered=0; qCorrect=0;

  // Ground
  platforms.push({x:0,y:GROUND_Y,w:LW,h:60,ground:true});

  // Static platform layout (same per level, aesthetic)
  const plats=[
    {x:160,y:GROUND_Y-100,w:110,h:18},
    {x:340,y:GROUND_Y-145,w:100,h:18},
    {x:500,y:GROUND_Y-95, w:90, h:18},
    {x:660,y:GROUND_Y-155,w:110,h:18},
    {x:820,y:GROUND_Y-110,w:90, h:18},
    {x:970,y:GROUND_Y-155,w:120,h:18},
    {x:1150,y:GROUND_Y-100,w:100,h:18},
    {x:1300,y:GROUND_Y-165,w:110,h:18},
    {x:1470,y:GROUND_Y-110,w:90, h:18},
    {x:1620,y:GROUND_Y-150,w:120,h:18},
    {x:1800,y:GROUND_Y-100,w:100,h:18},
    {x:1960,y:GROUND_Y-160,w:110,h:18},
    {x:2130,y:GROUND_Y-110,w:90, h:18},
    {x:2280,y:GROUND_Y-150,w:120,h:18},
    {x:2440,y:GROUND_Y-100,w:100,h:18},
    {x:2590,y:GROUND_Y-155,w:110,h:18},
  ];
  plats.forEach(p=>platforms.push({...p,ground:false}));

  // Question blocks — 5 per level, spread across level
  const lvl=LEVELS[idx];
  const qxs=[360,720,1100,1500,1900];
  qxs.forEach((qx,i)=>{
    if(i<lvl.qs.length){
      qblocks.push({x:qx,y:GROUND_Y-190,w:42,h:42,hit:false,qi:i,bounce:0});
    }
  });

  // Coins
  for(let i=0;i<28;i++){
    coins.push({x:120+i*95+Math.random()*40, y:GROUND_Y-80-Math.random()*90, done:false});
  }

  // Flag pole
  platforms.push({x:LW-80,y:GROUND_Y-220,w:12,h:220,ground:false,pole:true});

  pl.x=80; pl.y=GROUND_Y-pl.h; pl.vx=0; pl.vy=0; pl.ground=false;
}

// ─── GAME LOGIC ───────────────────────────────────────────────────────────────
function startGame(){ lvlIdx=0; lives=3; score=0; buildLevel(0); state='playing'; }

function doNextLevel(){
  lvlIdx++;
  if(lvlIdx>=LEVELS.length){ state='win'; return; }
  buildLevel(lvlIdx); state='playing';
}

function loseLife(){
  lives--;
  if(lives<=0){ state='over'; return; }
  pl.x=80; pl.y=GROUND_Y-pl.h; pl.vx=0; pl.vy=0; camX=0;
}

function boom(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,col,life:28,maxLife:28});
  }
}

function update(){
  if(state!=='playing'||quizOpen) return;

  let dx=0;
  if(keys['ArrowLeft']||keys['KeyA']){dx=-1; pl.dir=-1;}
  if(keys['ArrowRight']||keys['KeyD']){dx=1; pl.dir=1;}
  pl.vx = dx*SPD;

  if((keys['ArrowUp']||keys['KeyW']||keys['Space']) && pl.ground){
    pl.vy=JUMP; pl.ground=false;
  }

  pl.vy += G;
  if(pl.vy>16) pl.vy=16;
  pl.x += pl.vx;
  pl.y += pl.vy;

  if(pl.x<0) pl.x=0;
  if(pl.x>LW-pl.w) pl.x=LW-pl.w;

  pl.ground=false;
  for(const p of platforms){
    if(p.pole) continue;
    if(rect(pl,p)){
      const oy=Math.min(pl.y+pl.h,p.y+p.h)-Math.max(pl.y,p.y);
      const ox=Math.min(pl.x+pl.w,p.x+p.w)-Math.max(pl.x,p.x);
      if(oy<ox){
        if(pl.y+pl.h/2<p.y+p.h/2){ pl.y=p.y-pl.h; pl.vy=0; pl.ground=true; }
        else { pl.y=p.y+p.h; pl.vy=Math.abs(pl.vy)*0.3; }
      } else {
        if(pl.x+pl.w/2<p.x+p.w/2) pl.x=p.x-pl.w;
        else pl.x=p.x+p.w;
        pl.vx=0;
      }
    }
  }

  // Hit question blocks from below (jumping up)
  for(const qb of qblocks){
    if(qb.hit) continue;
    // Below collision: player head touches block bottom
    const head={x:pl.x+4,y:pl.y-4,w:pl.w-8,h:8};
    const foot={x:qb.x,y:qb.y+qb.h-2,w:qb.w,h:6};
    if(pl.vy<-1 && rect(head,foot)){
      qb.hit=true; qb.bounce=10;
      pl.vy=3;
      boom(qb.x+qb.w/2, qb.y,'#FFD700');
      openQuiz(qb.qi);
    }
    // Also: walk into block zone trigger (at ? block level, player overlaps)
    if(!qb.hit && pl.x+pl.w>qb.x+2 && pl.x<qb.x+qb.w-2 &&
       pl.y<qb.y+qb.h && pl.y+pl.h>qb.y){
      qb.hit=true; qb.bounce=8;
      boom(qb.x+qb.w/2,qb.y,'#FFD700');
      openQuiz(qb.qi);
    }
  }

  // Coins
  for(const c of coins){
    if(!c.done && pl.x+pl.w>c.x-8 && pl.x<c.x+18 && pl.y+pl.h>c.y-8 && pl.y<c.y+18){
      c.done=true; score+=10; boom(c.x,c.y,'#FFD700',6);
    }
  }

  // Flag reach — only if all questions answered
  const flag={x:LW-80,y:GROUND_Y-220,w:60,h:220};
  if(rect(pl,flag)){
    const needed=LEVELS[lvlIdx].qs.length;
    if(qAnswered>=needed){ state='lvlEnd'; }
  }

  if(pl.y>H+80) loseLife();

  // Camera
  const tx=pl.x-W/2+pl.w/2;
  camX+=(tx-camX)*0.12;
  camX=Math.max(0,Math.min(LW-W,camX));

  // Walk anim
  if(pl.vx!==0 && pl.ground){ pl.wt++; if(pl.wt>7){pl.wt=0;pl.wf=(pl.wf+1)%3;} }
  else { pl.wf=0; pl.wt=0; }

  // Bounce qblocks
  for(const qb of qblocks){ if(qb.bounce>0) qb.bounce-=2; }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

function rect(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function openQuiz(qi){
  const lvl=LEVELS[lvlIdx];
  if(qi>=lvl.qs.length) return;
  curQ=lvl.qs[qi]; quizOpen=true;

  document.getElementById('quizTitle').textContent=`${lvl.name} · ${curQ.r}`;
  document.getElementById('quizQ').textContent=curQ.t;
  document.getElementById('quizExp').style.display='none';
  document.getElementById('quizCont').style.display='none';

  const opts=document.getElementById('quizOpts');
  opts.innerHTML='';
  curQ.o.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='obtn'; b.textContent=txt;
    b.onclick=()=>answer(i,b);
    opts.appendChild(b);
  });

  document.getElementById('quiz').style.display='block';
}

function answer(i,btn){
  if(!curQ) return;
  const right=i===curQ.c;
  qAnswered++;

  document.querySelectorAll('.obtn').forEach((b,j)=>{
    b.disabled=true;
    if(j===curQ.c) b.classList.add('ok');
    else if(j===i && !right) b.classList.add('bad');
  });

  const exp=document.getElementById('quizExp');
  exp.textContent=(right?'✓ Correto! ':'✗ Errado. ')+curQ.e;
  exp.style.display='block';
  document.getElementById('quizCont').style.display='block';

  if(right){ qCorrect++; score+=100; boom(pl.x+pl.w/2,pl.y,'#FFD700',12); }
  else { score=Math.max(0,score-20); }
}

function closeQuiz(){
  document.getElementById('quiz').style.display='none';
  quizOpen=false; curQ=null;
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='title'){drawTitle();return;}
  if(state==='over'){drawOver();return;}
  if(state==='win'){drawWin();return;}
  if(state==='lvlEnd'){drawLvlEnd();return;}

  const lvl=LEVELS[lvlIdx];

  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,lvl.bg);
  grad.addColorStop(1, darken(lvl.bg,40));
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  drawClouds(lvl.cloud);

  ctx.save(); ctx.translate(-camX,0);

  // Platforms
  for(const p of platforms){
    if(p.pole){
      ctx.fillStyle='#999'; ctx.fillRect(p.x,p.y,p.w,p.h);
      // Flag
      const done=qAnswered>=LEVELS[lvlIdx].qs.length;
      ctx.fillStyle=done?'#00DD00':'#DD0000';
      ctx.beginPath(); ctx.moveTo(p.x+p.w,p.y); ctx.lineTo(p.x+p.w+48,p.y+22); ctx.lineTo(p.x+p.w,p.y+44); ctx.fill();
      continue;
    }
    if(p.ground){
      ctx.fillStyle=lvl.groundBase; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle=lvl.groundColor; ctx.fillRect(p.x,p.y,p.w,16);
      // Ground texture
      ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1;
      for(let bx=p.x;bx<p.x+p.w;bx+=40){
        ctx.beginPath(); ctx.moveTo(bx,p.y+16); ctx.lineTo(bx,p.y+p.h); ctx.stroke();
      }
    } else {
      ctx.fillStyle='#cc7733'; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='#aa5511'; ctx.fillRect(p.x,p.y,p.w,5);
      // Brick lines
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
      for(let bx=p.x;bx<p.x+p.w;bx+=25){
        ctx.beginPath(); ctx.moveTo(bx,p.y); ctx.lineTo(bx,p.y+p.h); ctx.stroke();
      }
    }
  }

  // Question blocks
  for(const qb of qblocks){
    const by=qb.bounce>0?qb.y-qb.bounce*0.8:qb.y;
    if(qb.hit){
      ctx.fillStyle='#7a5533'; ctx.fillRect(qb.x,by,qb.w,qb.h);
      ctx.strokeStyle='#553311'; ctx.lineWidth=2; ctx.strokeRect(qb.x,by,qb.w,qb.h);
    } else {
      // Pulsing ? block
      const pulse=Math.sin(Date.now()/400)*3;
      ctx.fillStyle='#FFB800'; ctx.fillRect(qb.x,by-pulse,qb.w,qb.h);
      ctx.fillStyle='#FF8800';
      ctx.fillRect(qb.x,by-pulse,qb.w,5);
      ctx.fillRect(qb.x,by-pulse+qb.h-5,qb.w,5);
      ctx.fillRect(qb.x,by-pulse,5,qb.h);
      ctx.fillRect(qb.x+qb.w-5,by-pulse,5,qb.h);
      ctx.fillStyle='#993300';
      ctx.font='bold 26px serif'; ctx.textAlign='center';
      ctx.fillText('?',qb.x+qb.w/2,by-pulse+qb.h*0.72);
    }
  }

  // Coins
  for(const c of coins){
    if(!c.done){
      const bob=Math.sin(Date.now()/600+c.x)*3;
      ctx.fillStyle='#FFD700';
      ctx.beginPath(); ctx.arc(c.x,c.y+bob,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFB800';
      ctx.beginPath(); ctx.arc(c.x-2,c.y+bob-2,3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#CC8800'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(c.x,c.y+bob,8,0,Math.PI*2); ctx.stroke();
    }
  }

  // Particles
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-3,p.y-3,6,6);
  }
  ctx.globalAlpha=1;

  // Player
  drawMario(pl.x,pl.y,pl.dir,pl.wf,pl.ground,pl.vy);

  ctx.restore();

  drawHUD();

  // Instruction banner
  if(!quizOpen){
    const pending=LEVELS[lvlIdx].qs.length-qAnswered;
    if(pending>0){
      ctx.fillStyle='rgba(0,0,0,0.65)';
      roundRect(ctx,W/2-170,H-36,340,28,6); ctx.fill();
      ctx.fillStyle='#FFD700'; ctx.font='13px Courier New'; ctx.textAlign='center';
      ctx.fillText(`Encontre os blocos ? : ${pending} pergunta${pending>1?'s':''} restante${pending>1?'s':''}`,W/2,H-17);
    } else {
      ctx.fillStyle='rgba(0,100,0,0.75)';
      roundRect(ctx,W/2-170,H-36,340,28,6); ctx.fill();
      ctx.fillStyle='#AAFFAA'; ctx.font='13px Courier New'; ctx.textAlign='center';
      ctx.fillText('Chegue à bandeira verde para avançar! ▶',W/2,H-17);
    }
  }
}

function drawMario(x,y,dir,wf,onG,vy){
  ctx.save();
  if(dir<0){ ctx.translate(x+16,0); ctx.scale(-1,1); x=0; }
  else { ctx.translate(x,0); x=0; }

  // Shoes
  const lly = onG && wf===1 ? 2 : onG && wf===2 ? -2 : 0;
  ctx.fillStyle='#5a2800';
  ctx.fillRect(x,   y+36, 14, 8);   // left shoe
  ctx.fillRect(x+18,y+36-lly, 14, 8); // right shoe

  // Legs
  ctx.fillStyle='#0033aa';
  ctx.fillRect(x+2, y+28, 10, 12);
  ctx.fillRect(x+20,y+28+lly, 10, 12);

  // Overalls bib
  ctx.fillStyle='#0033aa';
  ctx.fillRect(x+8, y+16, 16, 8);
  // Straps
  ctx.fillRect(x+7, y+12, 4, 8);
  ctx.fillRect(x+21,y+12, 4, 8);

  // Body (shirt)
  ctx.fillStyle='#cc0000';
  ctx.fillRect(x+2, y+14, 28, 16);

  // Head (skin)
  ctx.fillStyle='#ffcc88';
  ctx.fillRect(x+6, y+1, 20, 14);

  // Hat
  ctx.fillStyle='#cc0000';
  ctx.fillRect(x+4, y-8, 24, 10);
  ctx.fillRect(x+2, y+1, 28, 4);

  // Hair under hat
  ctx.fillStyle='#884400';
  ctx.fillRect(x+6, y+1, 20, 3);

  // Eyes
  ctx.fillStyle='#111';
  ctx.fillRect(x+18,y+4, 5, 5);

  // Nose
  ctx.fillStyle='#dd9966';
  ctx.fillRect(x+21,y+9, 5, 3);

  // Mustache
  ctx.fillStyle='#884400';
  ctx.fillRect(x+11,y+10, 14, 4);

  // Buttons
  ctx.fillStyle='#FFD700';
  ctx.fillRect(x+11,y+17, 4, 4);
  ctx.fillRect(x+17,y+17, 4, 4);

  // Arms
  ctx.fillStyle='#cc0000';
  ctx.fillRect(x-2, y+14, 6, 10);
  ctx.fillRect(x+28,y+14, 6, 10);

  // Hands (skin)
  ctx.fillStyle='#ffcc88';
  ctx.fillRect(x-3, y+22, 6, 6);
  ctx.fillRect(x+29,y+22, 6, 6);

  ctx.restore();
}

function drawClouds(col){
  const t=Date.now()/20000;
  [[120,60],[320,40],[580,70],[150,110],[450,55],[700,80]].forEach(([cx,cy],i)=>{
    const x=((cx - camX*(0.15+i*0.02))%W+W*2)%W - 40;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(x,cy,22,0,Math.PI*2);
    ctx.arc(x+28,cy-8,26,0,Math.PI*2);
    ctx.arc(x+56,cy,22,0,Math.PI*2);
    ctx.fill();
  });
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.fillRect(0,0,W,44);

  // Lives (hearts drawn with canvas)
  for(let i=0;i<3;i++){
    const hx=14+i*28, hy=14;
    const alive=i<lives;
    drawHeart(hx,hy,alive?'#ff3355':'#553344');
  }

  // Score
  ctx.fillStyle='#FFD700'; ctx.font='bold 16px Courier New'; ctx.textAlign='center';
  ctx.fillText('PONTOS: '+score,W/2,28);

  // Level name
  ctx.fillStyle='#aaffaa'; ctx.font='12px Courier New'; ctx.textAlign='right';
  ctx.fillText('Fase '+(lvlIdx+1)+': '+LEVELS[lvlIdx].name,W-10,17);
  ctx.fillStyle='#FFD700';
  ctx.fillText('Perguntas: '+qAnswered+'/'+LEVELS[lvlIdx].qs.length,W-10,34);
}

function drawHeart(x,y,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.arc(x+5,y+4,5,Math.PI,0);
  ctx.arc(x+15,y+4,5,Math.PI,0);
  ctx.lineTo(x+20,y+9);
  ctx.lineTo(x+10,y+20);
  ctx.lineTo(x,y+9);
  ctx.closePath(); ctx.fill();
}

function drawTitle(){
  // ── SKY ──────────────────────────────────────────────────────
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a3a99'); g.addColorStop(1,'#5a9ad0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Nuvens estáticas
  ctx.fillStyle='rgba(255,255,255,0.65)';
  [[65,38],[245,26],[490,40],[670,30]].forEach(([cx,cy])=>{
    ctx.beginPath();
    ctx.arc(cx,cy,16,0,Math.PI*2);
    ctx.arc(cx+22,cy-7,20,0,Math.PI*2);
    ctx.arc(cx+44,cy,16,0,Math.PI*2);
    ctx.fill();
  });

  // Chão
  ctx.fillStyle='#228B22'; ctx.fillRect(0,H-68,W,16);
  ctx.fillStyle='#8B4513'; ctx.fillRect(0,H-52,W,52);

  // ── CABEÇALHO (centrado, y=10..112) ─────────────────────────
  ctx.shadowColor='#ff8800'; ctx.shadowBlur=14;
  ctx.fillStyle='#FFD700'; ctx.font='bold 50px serif'; ctx.textAlign='center';
  ctx.fillText('SÍLABA QUEST', W/2, 52);
  ctx.shadowBlur=0;

  ctx.fillStyle='#ffffff'; ctx.font='17px serif';
  ctx.fillText('A Aventura das Palavras', W/2, 76);

  ctx.fillStyle='#FFD700'; ctx.font='bold 13px Courier New';
  ctx.fillText('✎  Prof. Weldes Charles', W/2, 97);

  // Linha divisória
  ctx.strokeStyle='rgba(255,215,0,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(40,109); ctx.lineTo(W-40,109); ctx.stroke();

  // ── COLUNA ESQUERDA — lista de fases (x=30..390) ─────────────
  ctx.fillStyle='rgba(0,0,0,0.38)';
  roundRect(ctx,26,116,358,160,6); ctx.fill();

  ctx.fillStyle='#FFD700'; ctx.font='bold 12px Courier New'; ctx.textAlign='left';
  ctx.fillText('FASES DO JOGO:', 38, 133);

  LEVELS.forEach((l,i)=>{
    const lx=38, ly=152+i*22;
    const done=i<lvlIdx;
    ctx.fillStyle=done?'rgba(0,255,100,0.12)':'rgba(255,255,255,0.05)';
    ctx.fillRect(lx-2,ly-13,338,18);
    ctx.fillStyle=done?'#44ff88':'#ddd';
    ctx.font='12px Courier New';
    ctx.fillText((done?'✓ ':'▸ ')+'Fase '+(i+1)+': '+l.name, lx, ly);
  });
  // último item: y = 152 + 4*22 = 240

  // Botão de início (dentro do painel esquerdo)
  ctx.fillStyle='rgba(0,0,0,0.38)';
  roundRect(ctx,26,284,358,56,6); ctx.fill();

  if(Math.floor(Date.now()/550)%2){
    ctx.fillStyle='#FFD700'; ctx.font='bold 14px Courier New'; ctx.textAlign='center';
    ctx.fillText('► ENTER ou ESPAÇO para jogar ◄', 205, 308);
  }
  ctx.fillStyle='#aaa'; ctx.font='12px Courier New'; ctx.textAlign='center';
  ctx.fillText('← → Mover  |  ↑ / Espaço Pular', 205, 328);

  // ── COLUNA DIREITA — cena decorativa (x=420..780) ────────────
  // Blocos ?
  const qbY=210;
  [424,470,516,562].forEach((bx,i)=>{
    ctx.fillStyle=i%2===0?'#FFB800':'#cc7733';
    ctx.fillRect(bx,qbY,40,40);
    ctx.fillStyle=i%2===0?'#FF8800':'#aa5511';
    ctx.fillRect(bx,qbY,40,5); ctx.fillRect(bx,qbY+35,40,5);
    ctx.fillRect(bx,qbY,5,40); ctx.fillRect(bx+35,qbY,5,40);
    if(i%2===0){
      ctx.fillStyle='#993300'; ctx.font='bold 24px serif'; ctx.textAlign='center';
      ctx.fillText('?',bx+20,qbY+28);
    }
  });

  // Moedas flutuando acima dos blocos
  [444,512,580].forEach(cx=>{
    ctx.fillStyle='#FFD700';
    ctx.beginPath(); ctx.arc(cx,qbY-22,7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#CC8800'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,qbY-22,7,0,Math.PI*2); ctx.stroke();
  });

  // Mario sobre o chão
  drawMario(610, H-68-52, 1, 0, true, 0);

  // Bordinha do painel direito (visual)
  ctx.strokeStyle='rgba(255,215,0,0.18)'; ctx.lineWidth=1;
  roundRect(ctx,412,116,372,225,6); ctx.stroke();

  // Crédito de conteúdo
  ctx.fillStyle='rgba(0,0,0,0.38)';
  roundRect(ctx,412,348,372,32,6); ctx.fill();
  ctx.fillStyle='#FFEEAA'; ctx.font='11px Courier New'; ctx.textAlign='center';
  ctx.fillText('Divisão Silábica & Acentuação Gráfica · 1.º Ano EM', 598, 368);
}

function drawLvlEnd(){
  ctx.fillStyle='rgba(0,0,30,0.95)'; ctx.fillRect(0,0,W,H);

  ctx.shadowColor='#FFD700'; ctx.shadowBlur=20;
  ctx.fillStyle='#FFD700'; ctx.font='bold 44px serif'; ctx.textAlign='center';
  ctx.fillText('FASE COMPLETA!',W/2,100);
  ctx.shadowBlur=0;

  ctx.fillStyle='#aaffaa'; ctx.font='20px Courier New';
  ctx.fillText(LEVELS[lvlIdx].name,W/2,140);

  ctx.fillStyle='#fff'; ctx.font='17px Courier New';
  ctx.fillText('Perguntas corretas: '+qCorrect+' / '+qAnswered,W/2,188);
  ctx.fillText('Pontuação: '+score,W/2,218);

  const pct=qAnswered>0?qCorrect/qAnswered:0;
  const stars=pct>=0.8?3:pct>=0.6?2:1;
  ctx.font='42px serif';
  ctx.fillText('⭐'.repeat(stars)+'☆'.repeat(3-stars),W/2,270);

  if(lvlIdx<LEVELS.length-1){
    ctx.fillStyle='#FFD700'; ctx.font='15px Courier New';
    ctx.fillText('Próxima: Fase '+(lvlIdx+2)+' — '+LEVELS[lvlIdx+1].name,W/2,320);
  }
  if(Math.floor(Date.now()/550)%2){
    ctx.fillStyle='#aaffff'; ctx.font='bold 18px Courier New';
    ctx.fillText(lvlIdx<LEVELS.length-1?'► ENTER para continuar':'► ENTER para ver resultado final',W/2,H-55);
  }
}

function drawOver(){
  ctx.fillStyle='rgba(60,0,0,0.97)'; ctx.fillRect(0,0,W,H);
  ctx.shadowColor='#ff0000'; ctx.shadowBlur=20;
  ctx.fillStyle='#ff4444'; ctx.font='bold 66px serif'; ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,170);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='18px Courier New';
  ctx.fillText('Pontuação: '+score,W/2,240);
  ctx.fillStyle='#ffaa44'; ctx.font='15px Courier New';
  ctx.fillText('Revise o conteúdo e tente novamente!',W/2,285);
  if(Math.floor(Date.now()/550)%2){
    ctx.fillStyle='#FFD700'; ctx.font='bold 18px Courier New';
    ctx.fillText('► ENTER para reiniciar',W/2,H-60);
  }
}

function drawWin(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#002200'); g.addColorStop(1,'#004400');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.shadowColor='#FFD700'; ctx.shadowBlur=25;
  ctx.fillStyle='#FFD700'; ctx.font='bold 56px serif'; ctx.textAlign='center';
  ctx.fillText('PARABÉNS!',W/2,90);
  ctx.shadowBlur=0;

  ctx.fillStyle='#aaffaa'; ctx.font='19px Courier New';
  ctx.fillText('Você dominou todo o conteúdo!',W/2,135);

  ctx.fillStyle='#fff'; ctx.font='14px Courier New';
  ['✓ Regras de Divisão Silábica (Regras 1 a 10)',
   '✓ Observações de Divisão Silábica',
   '✓ Acentuação Gráfica — Regras Gerais',
   '✓ Acentuação Gráfica — Regras Especiais',
   '✓ Dicas de Acentuação Gráfica'
  ].forEach((l,i)=>{ ctx.fillText(l,W/2,178+i*26); });

  ctx.fillStyle='#FFD700'; ctx.font='bold 17px Courier New';
  ctx.fillText('Pontuação final: '+score,W/2,325);
  ctx.font='44px serif';
  ctx.fillText('⭐⭐⭐',W/2,375);

  if(Math.floor(Date.now()/550)%2){
    ctx.fillStyle='#aaffff'; ctx.font='16px Courier New';
    ctx.fillText('ENTER para jogar novamente',W/2,H-22);
  }
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function darken(hex,pct){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,((n>>16)&255)-pct);
  const g=Math.max(0,((n>>8)&255)-pct);
  const b=Math.max(0,(n&255)-pct);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ─── LOOP ─────────────────────────────────────────────────────────────────────
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
