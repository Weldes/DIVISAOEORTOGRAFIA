// ── Funções de banco de dados ─────────────────────────────────────────
async function dbSaveScore(nome, turma, pontuacao, fases){
  if(!SB_READY){ localSave(nome,turma,pontuacao,fases); return; }
  try {
    const { error } = await supa.from('ranking_classes').insert({ nome, turma, pontuacao, fases });
    if(error) throw error;
  } catch(e){ console.warn('Supabase erro:', e); localSave(nome,turma,pontuacao,fases); }
}

async function dbLoadRanking(){
  if(!SB_READY){ return localLoad(); }
  try {
    const { data, error } = await supa
      .from('ranking_classes')
      .select('*')
      .order('pontuacao', { ascending: false })
      .limit(20);
    if(error) throw error;
    return data.map(r => ({ ...r, dataStr: fmtDate(new Date(r.created_at)) }));
  } catch(e){ console.warn('Supabase erro:', e); return localLoad(); }
}

// ── Fallback LocalStorage ─────────────────────────────────────────────
function localSave(nome,turma,pontuacao,fases){
  const all = localLoad();
  all.push({ nome, turma, pontuacao, fases, dataStr: fmtDate(new Date()) });
  all.sort((a,b)=>b.pontuacao-a.pontuacao);
  localStorage.setItem('classes_ranking', JSON.stringify(all.slice(0,50)));
}
function localLoad(){
  try { return JSON.parse(localStorage.getItem('classes_ranking')||'[]'); }
  catch{ return []; }
}
function fmtDate(d){
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='Enter'||e.code==='Space'){
    if(state==='title') showReg();
    if(state==='lvlEnd') doNextLevel();
    if(state==='over'||state==='win') showReg();
  }
  if(e.code==='KeyZ'&&state==='playing'&&!quizOpen&&hasFlower) fireFlowerBullet();
});

function submitReg(){
  const nome  = document.getElementById('inNome').value.trim();
  const turma = document.getElementById('inTurma').value.trim();
  const err   = document.getElementById('regErr');
  if(!nome)  { err.textContent='Por favor, informe seu nome.'; return; }
  if(!turma) { err.textContent='Por favor, informe sua turma.'; return; }
  err.textContent='';
  playerName=nome; playerTurma=turma;
  document.getElementById('ovReg').classList.remove('show');
  startGame();
}

// ════════════════════════════════════════════════════════════════════════
//  RANKING
// ════════════════════════════════════════════════════════════════════════
function showRanking(fromReg=false){
  if(fromReg){
    document.getElementById('ovReg').classList.remove('show');
    afterRankingFrom='reg';
  } else {
    afterRankingFrom='title';
  }
  document.getElementById('rankPlayBtn').textContent =
    afterRankingFrom==='reg' ? '▶ Voltar ao cadastro' : '▶ Jogar';
  document.getElementById('rankLoading').style.display='block';
  document.getElementById('rankScroll').style.display='none';
  document.getElementById('ovRank').classList.add('show');
  loadAndRenderRanking();
}

function closeRanking(){
  document.getElementById('ovRank').classList.remove('show');
  if(afterRankingFrom==='reg') showReg();
}

async function loadAndRenderRanking(){
  let rows = await dbLoadRanking();
  // Professor sempre aparece no topo com 1000 pts acima do máximo possível
  // Máximo possível: 28 moedas×5fases×10 + 25 acertos×150 + ~60 inimigos×10 ≈ 5750
  const TEACHER = { nome:'Weldes Charles', turma:'Professor', pontuacao:6750, fases:LEVELS.length, dataStr:'01/01/26' };
  rows = rows.filter(r => !(r.nome==='Weldes Charles' && r.turma==='Professor'));
  rows.unshift(TEACHER);
  rows.sort((a,b) => b.pontuacao - a.pontuacao);
  document.getElementById('rankLoading').style.display='none';
  document.getElementById('rankScroll').scrollTop = 0;

  const tbody = document.getElementById('rankBody');
  tbody.innerHTML='';

  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:#888;padding:20px">Nenhuma pontuação registrada ainda.</td></tr>';
  } else {
    const medals=['🥇','🥈','🥉'];
    rows.forEach((r,i)=>{
      const isMe = playerName && r.nome===playerName && r.turma===playerTurma;
      const tr=document.createElement('tr');
      if(isMe) tr.className='me';
      tr.innerHTML=`
        <td>${i<3?'<span class="medal">'+medals[i]+'</span>':'#'+(i+1)}</td>
        <td>${esc(r.nome)}</td>
        <td>${esc(r.turma)}</td>
        <td><strong>${r.pontuacao}</strong></td>
        <td>${r.fases} fase${r.fases!==1?'s':''}</td>
        <td>${r.dataStr||'—'}</td>`;
      tbody.appendChild(tr);
    });
  }
  document.getElementById('rankScroll').style.display='block';
  if(!SB_READY){
    const msg=document.createElement('p');
    msg.style.cssText='font-size:11px;color:#666;text-align:center;margin-top:10px';
    msg.textContent='⚠ Modo local (Supabase não configurado) — ranking apenas neste dispositivo.';
    document.getElementById('rankScroll').after(msg);
  }
}

function esc(s){ return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

// ════════════════════════════════════════════════════════════════════════
//  BUILD LEVEL
// ════════════════════════════════════════════════════════════════════════
function buildLevel(idx){
  platforms=[]; qblocks=[]; coins=[]; particles=[]; enemies=[]; spikes=[]; flowerBullets=[];
  camX=0; qAnswered=0; qCorrect=0; plInvince=0; hasFlower=false; flower=null; flowerShotsLeft=0;

  platforms.push({x:0,y:GROUND_Y,w:LW,h:60,ground:true});

  // Elevated platforms: even-index → spikes, odd-index → enemies
  const elevPlats=[
    {x:160,y:GROUND_Y-100,w:110,h:18},{x:340,y:GROUND_Y-145,w:100,h:18},
    {x:500,y:GROUND_Y-95, w:90, h:18},{x:660,y:GROUND_Y-155,w:110,h:18},
    {x:820,y:GROUND_Y-110,w:90, h:18},{x:970,y:GROUND_Y-155,w:120,h:18},
    {x:1150,y:GROUND_Y-100,w:100,h:18},{x:1300,y:GROUND_Y-165,w:110,h:18},
    {x:1470,y:GROUND_Y-110,w:90, h:18},{x:1620,y:GROUND_Y-150,w:120,h:18},
    {x:1800,y:GROUND_Y-100,w:100,h:18},{x:1960,y:GROUND_Y-160,w:110,h:18},
    {x:2130,y:GROUND_Y-110,w:90, h:18},{x:2280,y:GROUND_Y-150,w:120,h:18},
    {x:2440,y:GROUND_Y-100,w:100,h:18},{x:2590,y:GROUND_Y-155,w:110,h:18},
  ];
  elevPlats.forEach(p=>platforms.push({...p,ground:false}));

  [360,720,1100,1500,1900].forEach((qx,i)=>{
    if(i<LEVELS[idx].qs.length)
      qblocks.push({x:qx,y:GROUND_Y-190,w:42,h:42,hit:false,qi:i,bounce:0});
  });
  for(let i=0;i<28;i++)
    coins.push({x:120+i*95+Math.random()*40,y:GROUND_Y-80-Math.random()*90,done:false});

  // Ground enemies (6 patrulheiros no chão)
  [250,650,1050,1450,1850,2250].forEach(ex=>{
    enemies.push({x:ex,y:GROUND_Y-28,w:28,h:28,
      vx:1.4*(Math.random()>0.5?1:-1),dead:false,deadTimer:0,
      minX:Math.max(10,ex-180),maxX:Math.min(LW-30,ex+180)});
  });

  // Platform enemies on odd-indexed elevated platforms
  [1,3,5,7,9,11].forEach(pi=>{
    const p=elevPlats[pi]; if(!p||p.w<50) return;
    enemies.push({x:p.x+10,y:p.y-28,w:28,h:28,
      vx:1.1*(Math.random()>0.5?1:-1),dead:false,deadTimer:0,
      minX:p.x+2,maxX:p.x+p.w-30});
  });


  // Random flower on the ground (easy to find)
  const gfx=[300,700,1100,1500,1900,2200];
  const fx=gfx[Math.floor(Math.random()*gfx.length)];
  flower={x:fx,y:GROUND_Y-28,w:22,h:28,collected:false};

  platforms.push({x:LW-80,y:GROUND_Y-220,w:12,h:220,ground:false,pole:true});
  pl.x=80; pl.y=GROUND_Y-pl.h; pl.vx=0; pl.vy=0; pl.ground=false;
}

// ════════════════════════════════════════════════════════════════════════
//  GAME FLOW
// ════════════════════════════════════════════════════════════════════════
function startGame(){
  lvlIdx=0; lives=3; score=0; killCount=0; scoreSaved=false;
  buildLevel(0); state='playing';
}
function doNextLevel(){
  lvlIdx++;
  if(lvlIdx>=LEVELS.length){ state='win'; saveScoreIfNeeded(); return; }
  buildLevel(lvlIdx); state='playing';
}
function loseLife(){
  score=Math.max(0,score-100);
  lives--;
  if(lives<=0){ state='over'; saveScoreIfNeeded(); return; }
  pl.x=80; pl.y=GROUND_Y-pl.h; pl.vx=0; pl.vy=0; camX=0;
  plInvince=120;
}
async function saveScoreIfNeeded(){
  if(scoreSaved||!playerName) return;
  scoreSaved=true;
  await dbSaveScore(playerName, playerTurma, score, lvlIdx);
}
function boom(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,col,life:28,maxLife:28});
  }
}
function fireFlowerBullet(){
  if(!hasFlower) return;
  flowerBullets.push({x:pl.x+(pl.dir>0?pl.w:-14),y:pl.y+pl.h/2-8,vx:pl.dir*11,w:16,h:16});
  boom(pl.x+pl.w/2,pl.y+pl.h/2,'#ff88cc',8);
  flowerShotsLeft--;
  if(flowerShotsLeft<=0) hasFlower=false;
}

function onEnemyKilled(){
  killCount++;
  if(killCount%3===0){
    lives++;
    boom(pl.x+pl.w/2,pl.y+pl.h/2,'#ff3355',14);
  }
}

// ════════════════════════════════════════════════════════════════════════
//  UPDATE
// ════════════════════════════════════════════════════════════════════════
function update(){
  if(state!=='playing'||quizOpen) return;
  let dx=0;
  if(keys['ArrowLeft']||keys['KeyA']){dx=-1;pl.dir=-1;}
  if(keys['ArrowRight']||keys['KeyD']){dx=1;pl.dir=1;}
  pl.vx=dx*SPD;
  if((keys['ArrowUp']||keys['KeyW']||keys['Space'])&&pl.ground){pl.vy=JUMP;pl.ground=false;}
  pl.vy+=G; if(pl.vy>16)pl.vy=16;
  pl.x+=pl.vx; pl.y+=pl.vy;
  if(pl.x<0)pl.x=0; if(pl.x>LW-pl.w)pl.x=LW-pl.w;

  pl.ground=false;
  for(const p of platforms){
    if(p.pole) continue;
    if(rect(pl,p)){
      const oy=Math.min(pl.y+pl.h,p.y+p.h)-Math.max(pl.y,p.y);
      const ox=Math.min(pl.x+pl.w,p.x+p.w)-Math.max(pl.x,p.x);
      if(oy<ox){
        if(pl.y+pl.h/2<p.y+p.h/2){pl.y=p.y-pl.h;pl.vy=0;pl.ground=true;}
        else{pl.y=p.y+p.h;pl.vy=Math.abs(pl.vy)*0.3;}
      } else {
        if(pl.x+pl.w/2<p.x+p.w/2)pl.x=p.x-pl.w; else pl.x=p.x+p.w;
        pl.vx=0;
      }
    }
  }
  for(const qb of qblocks){
    if(qb.hit) continue;
    const head={x:pl.x+4,y:pl.y-4,w:pl.w-8,h:8};
    const foot={x:qb.x,y:qb.y+qb.h-2,w:qb.w,h:6};
    if(pl.vy<-1&&rect(head,foot)){
      qb.hit=true;qb.bounce=10;pl.vy=3;boom(qb.x+qb.w/2,qb.y,'#22C55E');openQuiz(qb.qi);
    }
    if(!qb.hit&&pl.x+pl.w>qb.x+2&&pl.x<qb.x+qb.w-2&&pl.y<qb.y+qb.h&&pl.y+pl.h>qb.y){
      qb.hit=true;qb.bounce=8;boom(qb.x+qb.w/2,qb.y,'#22C55E');openQuiz(qb.qi);
    }
  }
  for(const c of coins){
    if(!c.done&&pl.x+pl.w>c.x-8&&pl.x<c.x+18&&pl.y+pl.h>c.y-8&&pl.y<c.y+18){
      c.done=true;score+=10;boom(c.x,c.y,'#22C55E',6);
    }
  }
  // ── Enemy + spike + flower update ───────────────────────────────────
  if(plInvince>0) plInvince--;

  // Flower collection
  if(flower&&!flower.collected&&
     pl.x+pl.w>flower.x&&pl.x<flower.x+flower.w&&
     pl.y+pl.h>flower.y&&pl.y<flower.y+flower.h){
    flower.collected=true; hasFlower=true; flowerShotsLeft=3;
    boom(flower.x+flower.w/2,flower.y,'#ff88cc',10);
  }


  for(let ei=enemies.length-1;ei>=0;ei--){
    const e=enemies[ei];
    if(e.dead){ e.deadTimer--; if(e.deadTimer<=0) enemies.splice(ei,1); continue; }
    e.x+=e.vx;
    if(e.x<=e.minX){ e.x=e.minX; e.vx=Math.abs(e.vx); }
    if(e.x+e.w>=e.maxX){ e.x=e.maxX-e.w; e.vx=-Math.abs(e.vx); }
    const hitX=pl.x+pl.w>e.x+4&&pl.x<e.x+e.w-4;
    // Stomp: player falling onto enemy top
    if(pl.vy>0&&hitX&&pl.y+pl.h>e.y+2&&pl.y+pl.h<e.y+e.h*0.6){
      e.dead=true; e.deadTimer=22;
      pl.vy=JUMP*0.55;
      score+=10; boom(e.x+e.w/2,e.y+e.h/2,'#aa4400',8); onEnemyKilled();
    }
    // Side/bottom hit
    else if(hitX&&pl.y+pl.h>e.y+6&&pl.y<e.y+e.h){
      if(plInvince===0) loseLife();
    }
  }

  // ── Projétil da flor ─────────────────────────────────────────────────
  for(let bi=flowerBullets.length-1;bi>=0;bi--){
    const b=flowerBullets[bi];
    b.x+=b.vx;
    if(b.x<-60||b.x>LW+60){flowerBullets.splice(bi,1);continue;}
    let hit=false;
    for(let ei=enemies.length-1;ei>=0;ei--){
      const e=enemies[ei]; if(e.dead) continue;
      if(b.x+b.w>e.x&&b.x<e.x+e.w&&b.y+b.h>e.y&&b.y<e.y+e.h){
        e.dead=true;e.deadTimer=22;
        score+=10;boom(e.x+e.w/2,e.y+e.h/2,'#ff44cc',14);onEnemyKilled();
        flowerBullets.splice(bi,1);hit=true;break;
      }
    }
  }

  const flag={x:LW-80,y:GROUND_Y-220,w:60,h:220};
  if(rect(pl,flag)&&qAnswered>=LEVELS[lvlIdx].qs.length) state='lvlEnd';
  if(pl.y>H+80) loseLife();

  const tx=pl.x-W/2+pl.w/2;
  camX+=(tx-camX)*0.12;
  camX=Math.max(0,Math.min(LW-W,camX));

  if(pl.vx!==0&&pl.ground){pl.wt++;if(pl.wt>7){pl.wt=0;pl.wf=(pl.wf+1)%3;}}
  else{pl.wf=0;pl.wt=0;}
  for(const qb of qblocks){if(qb.bounce>0)qb.bounce-=2;}
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// ════════════════════════════════════════════════════════════════════════
//  QUIZ
// ════════════════════════════════════════════════════════════════════════
function openQuiz(qi){
  const lvl=LEVELS[lvlIdx];
  if(qi>=lvl.qs.length) return;
  quizOpen=true;
  // Shuffle options: garante que a resposta correta NUNCA fique na posição original
  const orig=lvl.qs[qi];
  let order;
  let attempts=0;
  do {
    order=orig.o.map((_,i)=>i);
    for(let k=order.length-1;k>0;k--){
      const j=Math.floor(Math.random()*(k+1));
      [order[k],order[j]]=[order[j],order[k]];
    }
    attempts++;
  } while(order.indexOf(orig.c)===orig.c && attempts<20);
  curQ={...orig, o:order.map(i=>orig.o[i]), c:order.indexOf(orig.c)};

  document.getElementById('quizTitle').textContent=`${lvl.name} · ${curQ.r}`;
  document.getElementById('quizQ').textContent=curQ.t;
  document.getElementById('quizExp').style.display='none';
  document.getElementById('quizCont').style.display='none';
  const opts=document.getElementById('quizOpts');
  opts.innerHTML='';
  curQ.o.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='obtn'; b.textContent=txt;
    b.onclick=()=>answer(i,b); opts.appendChild(b);
  });
  document.getElementById('quiz').style.display='block';
}
function answer(i){
  if(!curQ) return;
  const right=i===curQ.c; qAnswered++;
  document.querySelectorAll('.obtn').forEach((b,j)=>{
    b.disabled=true;
    if(j===curQ.c)b.classList.add('ok');
    else if(j===i&&!right)b.classList.add('bad');
  });
  const exp=document.getElementById('quizExp');
  exp.textContent=(right?'✓ Correto! ':'✗ Errado. ')+curQ.e;
  exp.style.display='block';
  document.getElementById('quizCont').style.display='block';
  if(right){qCorrect++;score+=150;boom(pl.x+pl.w/2,pl.y,'#22C55E',12);}
  else{score=Math.max(0,score-50);}
}
function closeQuiz(){
  document.getElementById('quiz').style.display='none';
  quizOpen=false; curQ=null;
}

// ════════════════════════════════════════════════════════════════════════
//  DRAW
// ════════════════════════════════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='title'){drawTitle();return;}
  if(state==='over'){drawOver();return;}
  if(state==='win'){drawWin();return;}
  if(state==='lvlEnd'){drawLvlEnd();return;}

  const lvl=LEVELS[lvlIdx];
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,lvl.bg); grad.addColorStop(1,darken(lvl.bg,40));
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  drawClouds(lvl.cloud);
  ctx.save(); ctx.translate(-camX,0);

  for(const p of platforms){
    if(p.pole){
      ctx.fillStyle='#999'; ctx.fillRect(p.x,p.y,p.w,p.h);
      const done=qAnswered>=LEVELS[lvlIdx].qs.length;
      ctx.fillStyle=done?'#00DD00':'#DD0000';
      ctx.beginPath();ctx.moveTo(p.x+p.w,p.y);ctx.lineTo(p.x+p.w+48,p.y+22);ctx.lineTo(p.x+p.w,p.y+44);ctx.fill();
      continue;
    }
    if(p.ground){
      ctx.fillStyle=lvl.groundBase; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle=lvl.groundColor; ctx.fillRect(p.x,p.y,p.w,16);
      ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1;
      for(let bx=p.x;bx<p.x+p.w;bx+=40){ctx.beginPath();ctx.moveTo(bx,p.y+16);ctx.lineTo(bx,p.y+p.h);ctx.stroke();}
    } else {
      ctx.fillStyle='#cc7733'; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='#aa5511'; ctx.fillRect(p.x,p.y,p.w,5);
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
      for(let bx=p.x;bx<p.x+p.w;bx+=25){ctx.beginPath();ctx.moveTo(bx,p.y);ctx.lineTo(bx,p.y+p.h);ctx.stroke();}
    }
  }
  for(const qb of qblocks){
    const by=qb.bounce>0?qb.y-qb.bounce*0.8:qb.y;
    if(qb.hit){
      ctx.fillStyle='#7a5533'; ctx.fillRect(qb.x,by,qb.w,qb.h);
      ctx.strokeStyle='#553311'; ctx.lineWidth=2; ctx.strokeRect(qb.x,by,qb.w,qb.h);
    } else {
      const pulse=Math.sin(Date.now()/400)*3;
      ctx.fillStyle='#16a34a'; ctx.fillRect(qb.x,by-pulse,qb.w,qb.h);
      ctx.fillStyle='#15803d';
      ctx.fillRect(qb.x,by-pulse,qb.w,5); ctx.fillRect(qb.x,by-pulse+qb.h-5,qb.w,5);
      ctx.fillRect(qb.x,by-pulse,5,qb.h); ctx.fillRect(qb.x+qb.w-5,by-pulse,5,qb.h);
      ctx.fillStyle='#14532d'; ctx.font='bold 26px serif'; ctx.textAlign='center';
      ctx.fillText('?',qb.x+qb.w/2,by-pulse+qb.h*0.72);
    }
  }
  for(const c of coins){
    if(!c.done){
      const bob=Math.sin(Date.now()/600+c.x)*3;
      ctx.fillStyle='#22C55E'; ctx.beginPath(); ctx.arc(c.x,c.y+bob,8,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#15803d'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(c.x,c.y+bob,8,0,Math.PI*2); ctx.stroke();
    }
  }
  // Flower power-up
  if(flower&&!flower.collected) drawFlower(flower);
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.col;
    ctx.fillRect(p.x-3,p.y-3,6,6);
  }
  ctx.globalAlpha=1;
  // Draw enemies
  for(const e of enemies) drawEnemy(e);
  // Draw flower bullets
  for(const b of flowerBullets){
    const sz=7+Math.sin(Date.now()/60)*2;
    const grd=ctx.createRadialGradient(b.x+b.w/2,b.y+b.h/2,1,b.x+b.w/2,b.y+b.h/2,sz+5);
    grd.addColorStop(0,'rgba(255,80,220,1)'); grd.addColorStop(1,'rgba(255,80,220,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(b.x+b.w/2,b.y+b.h/2,sz+5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x+b.w/2,b.y+b.h/2,4,0,Math.PI*2); ctx.fill();
  }
  // Draw Mario with invincibility blink
  if(plInvince===0 || Math.floor(plInvince/5)%2===0){
    drawMario(pl.x,pl.y,pl.dir,pl.wf,pl.ground,pl.vy);
  }
  ctx.restore();
  drawHUD();
  if(!quizOpen){
    const pending=LEVELS[lvlIdx].qs.length-qAnswered;
    if(pending>0){
      ctx.fillStyle='rgba(0,0,0,0.65)'; roundRect(ctx,W/2-170,H-36,340,28,6); ctx.fill();
      ctx.fillStyle='#22C55E'; ctx.font='13px Courier New'; ctx.textAlign='center';
      ctx.fillText(`Encontre os blocos ? : ${pending} pergunta${pending>1?'s':''} restante${pending>1?'s':''}`,W/2,H-17);
    } else {
      ctx.fillStyle='rgba(0,100,0,0.75)'; roundRect(ctx,W/2-170,H-36,340,28,6); ctx.fill();
      ctx.fillStyle='#AAFFAA'; ctx.font='13px Courier New'; ctx.textAlign='center';
      ctx.fillText('Chegue à bandeira verde para avançar! ▶',W/2,H-17);
    }
  }
}

// ── MARIO ────────────────────────────────────────────────────────────
function drawMario(x,y,dir,wf,onG){
  ctx.save();
  if(dir<0){ctx.translate(x+16,0);ctx.scale(-1,1);x=0;}else{ctx.translate(x,0);x=0;}
  const lly=onG&&wf===1?2:onG&&wf===2?-2:0;
  ctx.fillStyle='#5a2800'; ctx.fillRect(x,y+36,14,8); ctx.fillRect(x+18,y+36-lly,14,8);
  ctx.fillStyle='#0033aa'; ctx.fillRect(x+2,y+28,10,12); ctx.fillRect(x+20,y+28+lly,10,12);
  ctx.fillStyle='#0033aa'; ctx.fillRect(x+8,y+16,16,8); ctx.fillRect(x+7,y+12,4,8); ctx.fillRect(x+21,y+12,4,8);
  ctx.fillStyle='#cc0000'; ctx.fillRect(x+2,y+14,28,16);
  ctx.fillStyle='#ffcc88'; ctx.fillRect(x+6,y+1,20,14);
  ctx.fillStyle='#cc0000'; ctx.fillRect(x+4,y-8,24,10); ctx.fillRect(x+2,y+1,28,4);
  ctx.fillStyle='#884400'; ctx.fillRect(x+6,y+1,20,3);
  ctx.fillStyle='#111'; ctx.fillRect(x+18,y+4,5,5);
  ctx.fillStyle='#dd9966'; ctx.fillRect(x+21,y+9,5,3);
  ctx.fillStyle='#884400'; ctx.fillRect(x+11,y+10,14,4);

  ctx.fillStyle='#ffcc88'; ctx.fillRect(x-3,y+22,6,6); ctx.fillRect(x+29,y+22,6,6);

}

// ── INIMIGO (Goomba) ─────────────────────────────────────────────────
function drawEnemy(e){
  const ex=e.x, ey=e.y, ew=e.w, eh=e.h;
  if(e.dead){
    // Squashed flat
    ctx.fillStyle='#6b2800';
    ctx.beginPath(); ctx.ellipse(ex+ew/2,ey+eh-4,ew/2,5,0,0,Math.PI*2); ctx.fill();
    return;
  }
  // Walking wobble
  const wobY=Math.sin(Date.now()/140+ex)*1.5;
  // Body (round brown)
  ctx.fillStyle='#8B4513';
  ctx.beginPath(); ctx.ellipse(ex+ew/2,ey+eh*0.6+wobY,ew/2,eh*0.42,0,0,Math.PI*2); ctx.fill();
  // Head (darker dome)
  ctx.fillStyle='#6b2800';
  ctx.beginPath(); ctx.ellipse(ex+ew/2,ey+eh*0.3+wobY,ew/2*0.88,eh*0.36,0,Math.PI,0); ctx.fill();
  // Feet (alternate)
  const ft=Math.floor(Date.now()/160)%2;
  ctx.fillStyle='#2a0f00';
  ctx.beginPath(); ctx.ellipse(ex+6+(ft?4:0),ey+eh-3+wobY,6,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ex+ew-6-(ft?0:4),ey+eh-3+wobY,6,5,0,0,Math.PI*2); ctx.fill();
  // Eyes (white sclera)
  ctx.fillStyle='#fff';
  ctx.fillRect(ex+4,ey+eh*0.22-3+wobY,8,7);
  ctx.fillRect(ex+ew-12,ey+eh*0.22-3+wobY,8,7);
  // Pupils (angry — slant toward center-bottom)
  ctx.fillStyle='#000';
  const pupOff=e.vx>0?2:-2;
  ctx.fillRect(ex+5+pupOff,ey+eh*0.22-1+wobY,4,4);
  ctx.fillRect(ex+ew-11+pupOff,ey+eh*0.22-1+wobY,4,4);
  // Angry brows
  ctx.strokeStyle='#2a0f00'; ctx.lineWidth=2.5;
  ctx.beginPath();
  if(e.vx>0){
    ctx.moveTo(ex+3,ey+eh*0.22-5+wobY); ctx.lineTo(ex+12,ey+eh*0.22-3+wobY);
    ctx.moveTo(ex+ew-13,ey+eh*0.22-3+wobY); ctx.lineTo(ex+ew-3,ey+eh*0.22-5+wobY);
  } else {
    ctx.moveTo(ex+3,ey+eh*0.22-3+wobY); ctx.lineTo(ex+12,ey+eh*0.22-5+wobY);
    ctx.moveTo(ex+ew-13,ey+eh*0.22-5+wobY); ctx.lineTo(ex+ew-3,ey+eh*0.22-3+wobY);
  }
  ctx.stroke();
  // Teeth
  ctx.fillStyle='#fff';
  ctx.fillRect(ex+7,ey+eh*0.55+wobY,5,4);
  ctx.fillRect(ex+ew-12,ey+eh*0.55+wobY,5,4);
}

// ── FLOR POWER-UP ────────────────────────────────────────────────────
function drawFlower(f){
  const bob=Math.sin(Date.now()/350)*3;
  const cx=f.x+f.w/2, cy=f.y+10+bob;
  // Glow aura
  const grd=ctx.createRadialGradient(cx,cy,2,cx,cy,16);
  grd.addColorStop(0,'rgba(255,120,220,0.55)'); grd.addColorStop(1,'rgba(255,120,220,0)');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,16,0,Math.PI*2); ctx.fill();
  // Stem
  ctx.strokeStyle='#22aa22'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(cx,cy+8); ctx.lineTo(cx,f.y+f.h); ctx.stroke();
  // Petals
  const pCols=['#ff3366','#ff6600','#ffdd00','#ff33cc','#ff88aa'];
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2-Math.PI/2;
    ctx.fillStyle=pCols[i];
    ctx.beginPath(); ctx.ellipse(cx+Math.cos(a)*7,cy+Math.sin(a)*7,5,5,a,0,Math.PI*2); ctx.fill();
  }
  // Centre
  ctx.fillStyle='#22C55E';
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#15803d'; ctx.lineWidth=1; ctx.stroke();
}

function drawClouds(col){

function drawHeart(x,y,col){
  ctx.fillStyle=col; ctx.beginPath();

}

//  HELPERS
// ════════════════════════════════════════════════════════════════════════
function darken(hex,pct){
  const n=parseInt(hex.replace('#','').padStart(6,'0'),16);
  const r=Math.max(0,((n>>16)&255)-pct), gg=Math.max(0,((n>>8)&255)-pct), b=Math.max(0,(n&255)-pct);
  return '#'+[r,gg,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
